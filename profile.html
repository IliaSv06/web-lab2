<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шиков Илья Васильевич — Профиль</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark p-3">
        <div class="container-fluid">
            <a href="#" class="navbar-brand d-flex align-items-center">
                <img src="logohack.jpg" alt="Логотип сайта" class="me-2" width="40" height="40">
                <span class="text-light">History</span>
            </a>
        </div>
    </nav>

    
    <div class="container mt-5">
        <div class="story-container">

            <div class="story-text">
                <h2>Обо мне</h2>
                <p>Привет! Меня зовут Илья. Я изучаю информационную безопасность и веб-разработку.</p>
                <p>На этом сайте я буду делиться своими интересами, фотографиями и публикациями.</p>
            </div>

            <div class="photo-column">
                <img src="hack1.jpg" alt="Фото хакера" class="hacker-img">

                <div class="text-center mt-3">
                    <button id="toggleButton" type="button" class="btn btn-primary">
                        Open
                    </button>
                </div>

                <div id="extraImage" class="mt-3" style="display: none;">
                    <img src="hack2.jpg" alt="Скрытая фотография" class="hacker-img">
                </div>
            </div>

        </div>
    </div>
    
    <div class="container mt-5">
        <h2 class="text-center mb-4">Add New Post</h2>

        <form action="profile.php" id="postForm"
            class="d-flex flex-column gap-3"
            method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label class="form-label" for="postTitle">Post Title</label>
                <input type="text" name="postTitle"
                    class="form-control hacker-input"
                    id="postTitle" placeholder="Enter post Title" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="postContent">Post Content</label>
                <textarea name="postContent"
                        class="form-control hacker-input"
                        id="postContent" placeholder="Enter post Content"
                        rows="5" required></textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="file">Upload file</label>
                <input type="file" name="file"
                    class="form-control hacker-input" id="file">
            </div>

            <button class="btn btn-primary" type="submit" name="submit">
                Save Post
            </button>
        </form>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
